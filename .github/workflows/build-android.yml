# Android のビルドを GitHub の無料の機械で行う（EAS の月30回の枠を使わない）
# 使い方：GitHub の「Actions」→「Android build」→「Run workflow」→ profile を選んで実行
#   preview    … スマホに直接入れられる APK（確認用）
#   production … Google Play に出す AAB（クローズドテスト・公開用）
# 署名の鍵は EAS に保存されているものを使う（今入っているアプリに上書きできる）
# 準備：リポジトリの Settings → Secrets and variables → Actions に EXPO_TOKEN を登録
name: Android build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "preview（APK・確認用） / production（AAB・ストア用）"
        required: true
        default: preview
        type: choice
        options: [preview, production]

permissions:
  contents: write   # できたファイルを「Releases」に置くため

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: ソースを取得
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: EAS CLI（Expo にログイン）
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: パッケージを入れる
        run: npm ci

      - name: 計算の自動チェック（失敗したらビルドしない）
        run: node tests/calc.test.js && node tests/replan.test.js

      - name: ビルド
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          VER=$(node -p "require('./app.json').expo.version")
          EXT=$([ "$PROFILE" = "production" ] && echo aab || echo apk)
          OUT="KoePacer-v${VER}-${PROFILE}-${GITHUB_RUN_NUMBER}.${EXT}"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          echo "VER=$VER" >> "$GITHUB_ENV"
          eas build --platform android --profile "$PROFILE" --local --non-interactive --output "$OUT"

      - name: できたファイルを Releases に置く
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE: ${{ inputs.profile }}
        run: |
          TAG="android-${PROFILE}-${GITHUB_RUN_NUMBER}"
          SHORT=$(git rev-parse --short HEAD)
          gh release create "$TAG" "$OUT" --prerelease --target "$GITHUB_SHA" \
            --title "KoePacer v${VER}（${PROFILE}・コミット ${SHORT}）" \
            --notes "GitHub Actions でビルド。${PROFILE} = $([ "$PROFILE" = "production" ] && echo 'Google Play 用の AAB' || echo 'スマホに直接入れる APK')"
